<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registrar — Biblioteca Digital</title>
  <link rel="stylesheet" href="registro.css">
  <script src="registrar.js"></script>

</head>
<body>
  <div class="login-wrapper reverse">
    <!-- LADO ESQUERDO (BRANCO) -->
    <div class="login-left">
      <div class="brand-left-inner">
        <a href="/frontend/public/index.html"><img src="/frontend/public/imagens/logo.png" alt="Logo Biblioteca Digital" class="brand-logo" /></a>
        <div class="brand-name"><span class="digi">Digi</span><span class="tale">Tale</span></div>
        
      </div>
    </div>

    <!-- LADO DIREITO (AZUL) -->
    <div class="login-right">
      <form class="form-box" id="registerForm" novalidate>
        <h2>Registrar</h2>

        <label class="sr-only" for="name"></label>
        <div class="input-group">
          <div class="icon" aria-hidden="true">
            <!-- user icon SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"></path></svg>
          </div>
          <input id="name" name="name" type="text" placeholder="Nome completo" required />
        </div>

        <label class="sr-only" for="email"></label>
        <div class="input-group">
          <div class="icon" aria-hidden="true">
            <!-- mail icon SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path></svg>
          </div>
          <input id="email" name="email" type="email" placeholder="Email" required />
        </div>

        <label class="sr-only" for="password"></label>
        <div class="input-group">
          <div class="icon" aria-hidden="true">
            <!-- lock icon SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8V7a5 5 0 0 0-10 0v1H5v12h14V8h-2zm-8-1a3 3 0 0 1 6 0v1H9V7z"></path></svg>
          </div>
          <input id="password" name="password" type="password" placeholder="Senha" required minlength="6" />
        </div>

        <label class="sr-only" for="confirm"></label>
        <div class="input-group">
          <div class="icon" aria-hidden="true">
            <!-- lock icon SVG duplicate -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8V7a5 5 0 0 0-10 0v1H5v12h14V8h-2zm-8-1a3 3 0 0 1 6 0v1H9V7z"></path></svg>
          </div>
          <input id="confirm" name="confirm" type="password" placeholder="Confirmar senha" required minlength="6" />
        </div>

        <button class="btn-login" type="submit">Registrar</button>

        <div class="register-text">Já tem uma conta? <a href="/frontend/public/outras telas/login/login.html">Entrar</a></div>

        <div id="formError" class="error" style="display:none"></div>
      </form>
    </div>
  </div>

 
  <script src="registrar.js"></script>
</body>
</html>
